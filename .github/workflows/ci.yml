name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in sync with the "engines.node" minimum in package.json; the OS
  # matrix job below additionally exercises other supported versions.
  PRIMARY_NODE_VERSION: "22"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: pnpm format:check

      - name: Check immutable GitHub Action pins
        run: pnpm check:action-pins

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package smoke test
        run: node scripts/package-smoke.mjs

      - name: CLI smoke test - help and version
        shell: bash
        run: |
          node dist/cli/index.js --help
          node dist/cli/index.js --version
          node dist/cli/index.js validate --help
          node dist/cli/index.js inspect --help
          node dist/cli/index.js generate --help
          node dist/cli/index.js check --help
          node dist/cli/index.js analyze --help
          node dist/cli/index.js schema --help
          node dist/cli/index.js doctor --help
          node dist/cli/index.js explain --help
          node dist/cli/index.js init --help
          node dist/cli/index.js upgrade --help
          node dist/cli/index.js discover --help
          node dist/cli/index.js verify --help

      - name: CLI smoke test - valid examples pass
        shell: bash
        run: |
          node dist/cli/index.js validate --config examples/minimal/agent-ready.yaml
          node dist/cli/index.js validate --config examples/complete-phase-1/agent-ready.yaml
          node dist/cli/index.js inspect --config examples/complete-phase-1/agent-ready.yaml --json

      - name: CLI smoke test - generate dry run
        shell: bash
        run: |
          set -e
          output="$(node dist/cli/index.js generate --config examples/complete-phase-1/agent-ready.yaml --json)"
          echo "$output"
          if echo "$output" | grep -q "ADAPTER_NOT_YET_IMPLEMENTED"; then
            echo "Expected all five example adapters to be implemented" >&2
            exit 1
          fi

      - name: CLI smoke test - analyze documentation drift
        shell: bash
        run: |
          set -e
          output="$(node dist/cli/index.js analyze --json)"
          echo "$output"
          echo "$output" | grep -q '"ok": true'
          echo "$output" | grep -q '"linksChecked"'

      - name: CLI smoke test - invalid examples fail
        shell: bash
        run: |
          set -e
          for example in unknown-field invalid-command-reference invalid-path-traversal unsupported-version; do
            if node dist/cli/index.js validate --config "examples/invalid/$example.yaml" --json; then
              echo "Expected examples/invalid/$example.yaml to fail validation" >&2
              exit 1
            fi
          done

      - name: CLI smoke test - verify dry run (this repo's own contract)
        shell: bash
        run: |
          set -e
          output="$(node dist/cli/index.js verify --json)"
          echo "$output"
          echo "$output" | grep -q '"mode": "dry-run"'
          echo "$output" | grep -q '"id": "build"'

      # `discover` is the one command that must succeed on a repository with
      # no contract, so it is exercised here on a synthetic empty directory
      # as well as on this repository. The snapshot must stay byte-identical
      # across runs, and no absolute path may leak into it.
      - name: CLI smoke test - discover (JSON and human)
        shell: bash
        run: |
          set -e
          output="$(node dist/cli/index.js discover --json)"
          echo "$output"
          echo "$output" | grep -q '"ok": true'
          echo "$output" | grep -q '"snapshotVersion": 0'
          echo "$output" | grep -q '"repository.contract.present"'
          echo "$output" | grep -q '"repository.declarationSurface.present"'
          echo "$output" | grep -q '"repository.packageManager.root"'
          echo "$output" | grep -q '"complete": true'

          again="$(node dist/cli/index.js discover --json)"
          if [ "$output" != "$again" ]; then
            echo "discover --json is not byte-identical across runs" >&2
            exit 1
          fi

          if echo "$output" | grep -q "$PWD"; then
            echo "discover --json leaked an absolute path into the snapshot" >&2
            exit 1
          fi

          node dist/cli/index.js discover

          empty="$(mktemp -d)"
          output="$(node dist/cli/index.js discover --root "$empty" --json)"
          echo "$output"
          # An empty directory is a valid, complete, empty result - not a
          # CONTRACT_NOT_FOUND failure.
          echo "$output" | grep -q '"DISCOVERY_NO_SIGNALS"'
          if echo "$output" | grep -q '"CONTRACT_NOT_FOUND"'; then
            echo "discover must never report CONTRACT_NOT_FOUND" >&2
            exit 1
          fi
          echo "$output" | grep -q '"complete": true'

          # A root that does not exist is the one fatal condition.
          if node dist/cli/index.js discover --root "$empty/nope" --json; then
            echo "Expected an unreadable discovery root to fail" >&2
            exit 1
          fi

          # Every code discovery can emit must be explainable.
          for code in DISCOVERY_ROOT_UNREADABLE DISCOVERY_PARTIAL DISCOVERY_FACT_CONFLICT DISCOVERY_FACT_INCOMPLETE DISCOVERY_WORKSPACE_UNSUPPORTED DISCOVERY_LOCKFILE_UNREADABLE DISCOVERY_NO_SIGNALS DISCOVERY_FACT_UNSUPPORTED; do
            node dist/cli/index.js explain --code "$code" --json | grep -q "\"$code\""
          done

      # Package and workspace discovery is proved by Vitest against real
      # repository shapes. What CI adds here is packaging and wiring: that the
      # built CLI reports a package and workspace model at all, and that
      # contradictory evidence is described rather than fatal. The fixture is
      # deliberately messy - two managers' lockfiles, a declaration that
      # disagrees with one of them, a declared path that is absent, a glob match
      # that is not a package, and an unmodelled declaration form.
      - name: CLI smoke test - discover packages and workspaces
        shell: bash
        run: |
          set -e
          tmp="$(mktemp -d)"
          cat > "$tmp/package.json" <<'JSON'
          {
            "name": "smoke-root",
            "packageManager": "pnpm@10.0.0",
            "workspaces": ["packages/*", "apps/site"]
          }
          JSON
          : > "$tmp/pnpm-lock.yaml"
          : > "$tmp/package-lock.json"
          mkdir -p "$tmp/packages/a" "$tmp/packages/docs" "$tmp/apps"
          echo '{"name": "a"}' > "$tmp/packages/a/package.json"
          echo '# notes, not a package' > "$tmp/packages/docs/README.md"
          git -C "$tmp" init --quiet

          output="$(node dist/cli/index.js discover --root "$tmp" --json)"
          echo "$output"
          echo "$output" | grep -q '"repository.packages"'
          echo "$output" | grep -q '"repository.workspace.declarations"'
          echo "$output" | grep -q '"repository.workspace.candidates"'
          echo "$output" | grep -q '"repository.workspace.members"'
          # The declared-but-absent path survives as an explicit absence.
          echo "$output" | grep -q '"apps/site"'
          # Two managers' artifacts beside a pnpm declaration is contested, not
          # resolved: the snapshot must carry both codes and no winner.
          echo "$output" | grep -q 'DISCOVERY_FACT_INCOMPLETE'
          echo "$output" | grep -q '"contradictedBy"'
          # `apps/site` was declared and is absent, which is a successful
          # observation, not a failure.
          echo "$output" | grep -q '"complete": true'
          # The path is canonical: repository-relative, never the temp absolute
          # root the fixture happens to live under.
          if echo "$output" | grep -q "$tmp"; then
            echo "discover --json leaked the fixture's absolute path" >&2
            exit 1
          fi

          # Human output must describe the same facts without inventing
          # certainty about the contested one.
          human="$(node dist/cli/index.js discover --root "$tmp")"
          echo "$human"
          echo "$human" | grep -q 'incomplete (pnpm; contradicted by npm)'
          if echo "$human" | grep -q '\[object Object\]'; then
            echo "discover rendered a structured value as [object Object]" >&2
            exit 1
          fi

          # A workspace declaration that escapes the root is refused, not read.
          escape="$(mktemp -d)"
          echo '{"name": "escape", "workspaces": ["../*"]}' > "$escape/package.json"
          git -C "$escape" init --quiet
          escaped="$(node dist/cli/index.js discover --root "$escape" --json)"
          echo "$escaped"
          echo "$escaped" | grep -q 'DISCOVERY_WORKSPACE_UNSUPPORTED'
          # The declaration is still reported verbatim - the repository did write
          # `"../*"` - but nothing was derived from it, and no path above the
          # root was read. Both collections being empty is the observable form
          # of "the refusal happened before any read".
          echo "$escaped" | grep -q '"repository.workspace.candidates": {'
          echo "$escaped" | grep -q '"repository.workspace.members": {'
          derived="$(echo "$escaped" | sed -n '/"repository.workspace.candidates"/,/"repository.workspace.declarations"/p')"
          echo "$derived" | grep -q '"value": \[\]'
          members="$(echo "$escaped" | sed -n '/"repository.workspace.members"/,/"repository.workspace.root"/p')"
          echo "$members" | grep -q '"value": \[\]'
          if echo "$derived$members" | grep -q '\.\.'; then
            echo "a refused workspace pattern reached outside the repository root" >&2
            exit 1
          fi

      - name: CLI smoke test - verify --execute (synthetic contract, real process spawning)
        shell: bash
        run: |
          set -e
          tmp="$(mktemp -d)"
          cat > "$tmp/agent-ready.yaml" <<'YAML'
          version: 1
          project:
            name: verify-smoke-test
          commands:
            ok:
              run: node -e "process.exit(0)"
            fail:
              run: node -e "process.exit(1)"
            unreached:
              run: node -e "process.exit(0)"
          verification:
            required:
              - ok
              - fail
              - unreached
          YAML

          output="$(node dist/cli/index.js verify --config "$tmp/agent-ready.yaml" --execute --json || true)"
          echo "$output"
          echo "$output" | grep -q '"status": "passed"'
          echo "$output" | grep -q '"status": "failed"'
          echo "$output" | grep -q '"status": "skipped"'

          if node dist/cli/index.js verify --config "$tmp/agent-ready.yaml" --execute --json; then
            echo "Expected the synthetic contract's failing command to make verify exit non-zero" >&2
            exit 1
          fi

      - name: CLI smoke test - verify --execute --record (evidence file)
        shell: bash
        run: |
          set -e
          tmp="$(mktemp -d)"
          cat > "$tmp/agent-ready.yaml" <<'YAML'
          version: 1
          project:
            name: verify-record-smoke-test
          commands:
            ok:
              run: node -e "process.exit(0)"
          verification:
            required:
              - ok
          YAML

          if node dist/cli/index.js verify --config "$tmp/agent-ready.yaml" --record --json; then
            echo "Expected --record without --execute to fail" >&2
            exit 1
          fi

          output="$(node dist/cli/index.js verify --config "$tmp/agent-ready.yaml" --execute --record --json)"
          echo "$output"
          echo "$output" | grep -q '"recordedTo"'

          evidence="$tmp/agent-ready-verify-result.json"
          if [ ! -f "$evidence" ]; then
            echo "Expected $evidence to exist" >&2
            exit 1
          fi
          cat "$evidence"
          grep -q '"recordedAt"' "$evidence"
          grep -q '"status": "passed"' "$evidence"

  node-versions:
    name: node ${{ matrix.node-version }} (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  dogfood-action:
    name: dogfood composite action (${{ matrix.command }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          [
            validate,
            inspect,
            generate,
            check,
            analyze,
            schema,
            doctor,
            explain,
            upgrade,
            discover,
            verify,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: agent-ready ${{ matrix.command }} (via ./action.yml)
        uses: ./
        with:
          command: ${{ matrix.command }}
          config: ${{ matrix.command != 'schema' && matrix.command != 'discover' && 'examples/complete-phase-1/agent-ready.yaml' || '' }}
          code: ${{ matrix.command == 'explain' && 'CONTRACT_NOT_FOUND' || '' }}
          json: "true"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high

  action-fail-fast:
    name: composite action fail-fast on unknown subcommand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The step name below contains the unquoted substring command: bogus,
      # which prettier-plugin-yaml's compact-mapping parser would otherwise
      # read as a nested mapping. Single-quoting the scalar suppresses that.
      - name: "agent-ready via ./action.yml with command: bogus (must fail)"
        id: fail-fast
        continue-on-error: true
        uses: ./
        with:
          command: bogus

      - name: assert the invalid command was rejected
        if: steps.fail-fast.outcome != 'failure'
        run: |
          echo "::error::agent-ready: action.yml must reject an unknown subcommand (command: bogus). The action step unexpectedly succeeded."
          exit 1
