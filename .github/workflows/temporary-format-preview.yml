name: Temporary Prettier preview (delete before merge)

on:
  push:
    branches:
      - docs/phase1-audit-and-master-backlog-20261120
      - research/phase1-v3-verification-applicability-20261120

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format and emit canonical text
        shell: bash
        run: |
          pnpm exec prettier --write "docs/planning/MASTER-WORK-INVENTORY.md"
          for file in "docs/planning/MASTER-WORK-INVENTORY.md"; do
            echo "FORMAT_RESULT_BEGIN:$file"
            cat "$file"
            echo "FORMAT_RESULT_END:$file"
          done
