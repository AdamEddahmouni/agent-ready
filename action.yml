name: "Agent-Ready"
description: >-
  Validate, inspect, generate, check, analyze, schema, doctor, explain, init,
  upgrade, discover, twin, and verify a repository's agent-ready.yaml contract,
  using this repository's own CLI built from source. See
  docs/specification/ci-integration.md.
author: "Agent-Ready"

inputs:
  command:
    description: >-
      The agent-ready subcommand to run: validate, inspect, generate,
      check, analyze, schema, doctor, explain, init, upgrade, discover, twin, or verify.
    required: true
  config:
    description: "Explicit path to the contract file (agent-ready.yaml)."
    required: false
  code:
    description: "(explain) Diagnostic code to explain."
    required: false
  json:
    description: "Print machine-readable JSON output instead of human-readable text."
    required: false
    default: "false"
  write:
    description: "(generate/init/upgrade) Write planned files to disk."
    required: false
    default: "false"
  check:
    description: "(generate) Exit non-zero if generated output would differ from what's on disk. Never writes."
    required: false
    default: "false"
  force:
    description: "(generate --write) Overwrite existing files that lack the managed-file marker."
    required: false
    default: "false"
  staged:
    description: "(check) Check staged changes instead of the full working tree."
    required: false
    default: "false"
  against:
    description: "(check) Check changes relative to this explicit Git ref instead of HEAD."
    required: false
  execute:
    description: "(verify) Actually run the contract's verification.required commands. Without this, verify only prints the plan."
    required: false
    default: "false"
  timeout:
    description: "(verify --execute) Per-command timeout in seconds (default: 900)."
    required: false
  record:
    description: "(verify --execute) Write a JSON evidence file (agent-ready-verify-result.json) to the repository root."
    required: false
    default: "false"
  twin-command:
    description: "(twin) Subcommand to run: build or query."
    required: false
  output:
    description: "(twin build) Destination path for the discovery snapshot JSON."
    required: false
  snapshot:
    description: "(twin query) Path to a Discovery Snapshot Format 1 JSON file."
    required: false
  query-kind:
    description: "(twin query) Query kind, e.g. summary, packages, or commands-for-package."
    required: false
  query-parameter:
    description: "(twin query) Parameter for the query kind, e.g. a package or module path."
    required: false
  query-limit:
    description: "(twin query) Maximum list entries before truncation."
    required: false
  node-version:
    description: "Node.js version to build and run Agent-Ready with."
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install Agent-Ready dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build Agent-Ready
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm build

    - name: Run agent-ready
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_CODE: ${{ inputs.code }}
        INPUT_JSON: ${{ inputs.json }}
        INPUT_WRITE: ${{ inputs.write }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_STAGED: ${{ inputs.staged }}
        INPUT_AGAINST: ${{ inputs.against }}
        INPUT_EXECUTE: ${{ inputs.execute }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_RECORD: ${{ inputs.record }}
        INPUT_TWIN_COMMAND: ${{ inputs.twin-command }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_SNAPSHOT: ${{ inputs.snapshot }}
        INPUT_QUERY_KIND: ${{ inputs.query-kind }}
        INPUT_QUERY_PARAMETER: ${{ inputs.query-parameter }}
        INPUT_QUERY_LIMIT: ${{ inputs.query-limit }}
      run: |
        set -euo pipefail

        # Bash does not parse `|` from a variable expansion as case-pattern
        # alternation. Keep an explicit regex for validation and a matching
        # display list for errors; update both with the command input prose.
        readonly accepted_subcommands_regex='^(validate|inspect|generate|check|analyze|schema|doctor|explain|init|upgrade|discover|twin|verify)$'
        readonly accepted_subcommands_display='validate, inspect, generate, check, analyze, schema, doctor, explain, init, upgrade, discover, twin, verify'

        if [[ ! "$INPUT_COMMAND" =~ $accepted_subcommands_regex ]]; then
          echo >&2 "::error::agent-ready: unknown command '$INPUT_COMMAND'. Accepted: $accepted_subcommands_display."
          exit 3
        fi

        # `twin` is the only command with a second positional level, so its
        # flags are validated here rather than appended from the generic block.
        if [ "$INPUT_COMMAND" = "twin" ]; then
          case "${INPUT_TWIN_COMMAND:-}" in
            build)
              if [ -z "${INPUT_OUTPUT:-}" ]; then
                echo >&2 "::error::agent-ready: twin build requires the output input."
                exit 3
              fi
              args=(twin build --output "$INPUT_OUTPUT")
              if [ "${INPUT_FORCE:-false}" = "true" ]; then args+=(--force); fi
              ;;
            query)
              if [ -z "${INPUT_SNAPSHOT:-}" ] || [ -z "${INPUT_QUERY_KIND:-}" ]; then
                echo >&2 "::error::agent-ready: twin query requires the snapshot and query-kind inputs."
                exit 3
              fi
              args=(twin query --snapshot "$INPUT_SNAPSHOT" --kind "$INPUT_QUERY_KIND")
              if [ -n "${INPUT_QUERY_PARAMETER:-}" ]; then args+=(--parameter "$INPUT_QUERY_PARAMETER"); fi
              if [ -n "${INPUT_QUERY_LIMIT:-}" ]; then args+=(--limit "$INPUT_QUERY_LIMIT"); fi
              if [ "${INPUT_JSON:-false}" = "true" ]; then args+=(--json); fi
              ;;
            *)
              echo >&2 "::error::agent-ready: command 'twin' requires twin-command to be 'build' or 'query'."
              exit 3
              ;;
          esac
        else
          args=("$INPUT_COMMAND")

          if [ -n "${INPUT_CONFIG:-}" ]; then args+=("--config" "$INPUT_CONFIG"); fi
          if [ -n "${INPUT_CODE:-}" ]; then args+=("--code" "$INPUT_CODE"); fi
          if [ "${INPUT_JSON:-false}" = "true" ]; then args+=("--json"); fi
          if [ "${INPUT_WRITE:-false}" = "true" ]; then args+=("--write"); fi
          if [ "${INPUT_CHECK:-false}" = "true" ]; then args+=("--check"); fi
          if [ "${INPUT_FORCE:-false}" = "true" ]; then args+=(--force); fi
          if [ "${INPUT_STAGED:-false}" = "true" ]; then args+=(--staged); fi
          if [ -n "${INPUT_AGAINST:-}" ]; then args+=("--against" "$INPUT_AGAINST"); fi
          if [ "${INPUT_EXECUTE:-false}" = "true" ]; then args+=(--execute); fi
          if [ -n "${INPUT_TIMEOUT:-}" ]; then args+=(--timeout "$INPUT_TIMEOUT"); fi
          if [ "${INPUT_RECORD:-false}" = "true" ]; then args+=(--record); fi
        fi

        node "$ACTION_PATH/dist/cli/index.js" "${args[@]}"

branding:
  icon: "check-circle"
  color: "blue"
